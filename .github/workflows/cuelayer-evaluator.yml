name: cuelayer-evaluator
on:
  pull_request:
    paths:
      - 'apps/cuelayer-v2/tests/evaluation/**'
      - 'apps/cuelayer-v2/scripts/evaluate-frontier.mjs'
      - '.github/workflows/cuelayer-evaluator.yml'
permissions:
  contents: read
jobs:
  unpaid-self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: evaluator
      - uses: actions/checkout@v4
        with:
          path: frozen-product
          ref: 1a796e8c713b6f00ef9beb72004b456833a82ff5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
        working-directory: frozen-product/apps/cuelayer-v2
      - run: npm ci
        working-directory: evaluator/apps/cuelayer-v2
      - run: node apps/cuelayer-v2/scripts/evaluate-frontier.mjs self-test
        working-directory: evaluator
        env:
          GATE3B_PRODUCT_ROOT: ${{ github.workspace }}/frozen-product
      # CI self-tests are not the full 600-second/browser 3b-0 gate.
      # No provider credentials, paid jobs, deployment or automatic gate promotion.
