name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Upload visual-review build
        uses: actions/upload-artifact@v4
        with:
          name: cuelayer-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
